<!doctype html>
<!--
    Página aberta pelo link do e-mail de "esqueci minha senha".
    O Supabase coloca o token no endereço, assim: redefinir-senha.html#access_token=...&type=recovery
    Por isso ela é separada do index.html (lá o # é usado pelas rotas do Angular).
-->
<html lang="pt-BR" ng-app="redefinir">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova senha — Pauta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body ng-controller="RedefinirCtrl">
    <nav class="navbar nav-pauta">
        <div class="container"><a class="navbar-brand brand" href="index.html">Pauta<span class="brand-dot">.</span></a></div>
    </nav>

    <div class="container auth-page">
        <div class="auth-card auth-card-sm">
            <div class="auth-form">
                <div class="auth-icon"><i class="bi bi-shield-lock"></i></div>
                <h1 class="auth-title">Criar nova senha</h1>

                <div ng-if="!token" class="alert alert-danger-soft">
                    Este link é inválido ou expirou. <a href="index.html#!/esqueci-senha" class="link-accent fw-semibold">Pedir um novo link</a>
                </div>

                <form ng-if="token && !pronto" ng-submit="salvar()" name="f" novalidate>
                    <p class="text-secondary">Escolha uma senha nova com pelo menos 6 caracteres.</p>
                    <div class="mb-3">
                        <label class="form-label" for="senha">Nova senha</label>
                        <input id="senha" type="password" class="form-control form-control-lg" ng-model="form.senha" required ng-minlength="6" autocomplete="new-password">
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="confirma">Confirmar senha</label>
                        <input id="confirma" type="password" class="form-control form-control-lg" ng-model="form.confirma" required autocomplete="new-password">
                        <div class="form-text text-danger" ng-if="form.confirma && form.confirma !== form.senha">As senhas não são iguais.</div>
                    </div>
                    <div class="alert alert-danger-soft" ng-if="erro">{{ erro }}</div>
                    <button class="btn btn-ink btn-lg w-100 rounded-pill" type="submit" ng-disabled="f.$invalid || form.senha !== form.confirma || enviando">
                        <span class="spinner-border spinner-border-sm me-2" ng-if="enviando"></span>Salvar nova senha
                    </button>
                </form>

                <div ng-if="pronto">
                    <div class="alert alert-success-soft"><i class="bi bi-check-circle me-2"></i>{{ pronto }}</div>
                    <a href="index.html#!/login" class="btn btn-ink btn-lg w-100 rounded-pill">Ir para o login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/angular@1.8.3/angular.min.js"></script>
    <script>
        var API_URL = 'http://localhost:3000' // mesmo valor de js/app.js

        angular.module('redefinir', []).controller('RedefinirCtrl', function ($scope, $http, $window) {
            // Lê o access_token que o Supabase colocou depois do #
            var params = new URLSearchParams($window.location.hash.slice(1))
            $scope.token = params.get('access_token')
            $scope.form = {}

            $scope.salvar = function () {
                $scope.enviando = true
                $scope.erro = null
                $http.post(API_URL + '/auth/redefinir-senha', { token: $scope.token, senha: $scope.form.senha })
                    .then(function (r) { $scope.pronto = r.data.mensagem })
                    .catch(function (r) { $scope.erro = (r.data && r.data.erro) || 'Não foi possível salvar. Tente de novo.' })
                    .finally(function () { $scope.enviando = false })
            }
        })
    </script>
</body>
</html>
