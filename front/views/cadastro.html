<div class="container auth-page">
    <div class="auth-card">
        <div class="auth-side d-none d-md-flex">
            <div class="brand text-white">Pauta<span class="brand-dot">.</span></div>
            <blockquote class="auth-quote">“Leia, curta, comente. A conversa é sua também.”</blockquote>
            <p class="text-white-50 small mb-0">Leva menos de um minuto.</p>
        </div>

        <div class="auth-form">
            <h1 class="auth-title">Criar conta</h1>
            <p class="text-secondary">Participe da conversa no Pauta.</p>

            <form ng-submit="cadastrar()" name="f" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="nome">Nome</label>
                    <input id="nome" type="text" class="form-control form-control-lg" ng-model="form.nome" required placeholder="Seu nome" autocomplete="name">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">E-mail</label>
                    <input id="email" type="email" class="form-control form-control-lg" ng-model="form.email" required placeholder="voce@email.com" autocomplete="email">
                </div>
                <div class="mb-4">
                    <label class="form-label" for="senha">Senha</label>
                    <input id="senha" type="password" class="form-control form-control-lg" ng-model="form.senha" required ng-minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                    <div class="form-text text-danger" ng-if="f.$submitted && f.senha.$error.minlength">A senha precisa ter pelo menos 6 caracteres.</div>
                </div>
                <button class="btn btn-ink btn-lg w-100 rounded-pill" type="submit" ng-disabled="f.$invalid || enviando">
                    <span class="spinner-border spinner-border-sm me-2" ng-if="enviando"></span>Criar conta
                </button>
            </form>

            <p class="text-center mt-4 mb-0 small">Já tem conta? <a href="#!/login" class="link-accent fw-semibold">Entrar</a></p>
        </div>
    </div>
</div>
