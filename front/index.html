<!doctype html>
<html lang="pt-BR" ng-app="blog">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pauta — notícias de tecnologia, games e cultura digital</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body ng-controller="NavCtrl">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-md nav-pauta sticky-top">
        <div class="container">
            <a class="navbar-brand brand" href="#!/">Pauta<span class="brand-dot">.</span></a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
                <i class="bi bi-list fs-2"></i>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto ms-md-4">
                    <li class="nav-item"><a class="nav-link" ng-class="{active: rotaAtual('/')}" href="#!/">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="#!/?categoria=Tecnologia">Tecnologia</a></li>
                    <li class="nav-item"><a class="nav-link" href="#!/?categoria=Games">Games</a></li>
                    <li class="nav-item"><a class="nav-link" href="#!/?categoria=Carros">Carros</a></li>
                </ul>

                <div class="d-flex align-items-center gap-2" ng-if="!auth.logado()">
                    <a class="btn btn-link link-ink text-decoration-none fw-semibold" href="#!/login">Entrar</a>
                    <a class="btn btn-ink rounded-pill px-4" href="#!/cadastro">Criar conta</a>
                </div>

                <div class="dropdown" ng-if="auth.logado()">
                    <button class="btn user-chip dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                        <span class="avatar avatar-sm" ng-style="{background: (auth.usuario().nome | corAvatar)}">{{ auth.usuario().nome | iniciais }}</span>
                        <span class="d-none d-lg-inline">{{ auth.usuario().nome }}</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-4 p-2">
                        <li class="px-3 py-2 small text-secondary">{{ auth.usuario().email }}</li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item rounded-3" href="" ng-click="sair()"><i class="bi bi-box-arrow-right me-2"></i>Sair</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- AQUI O ANGULAR TROCA AS TELAS -->
    <main ng-view class="view-anim"></main>

    <!-- RODAPÉ -->
    <footer class="footer-pauta mt-5">
        <div class="container py-5">
            <div class="row g-4 align-items-center">
                <div class="col-md-6">
                    <div class="brand text-white">Pauta<span class="brand-dot">.</span></div>
                    <p class="mt-2 mb-0 text-white-50">Notícias de tecnologia, games e cultura digital — sem enrolação.</p>
                </div>
                <div class="col-md-6">
                    <div class="footer-contact">
                        <a href="mailto:contato@pautablog.com.br"><i class="bi bi-envelope"></i> contato@pautablog.com.br</a>
                        <a href=""><i class="bi bi-instagram"></i> @pauta.blog</a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- AVISOS (toasts) -->
    <div class="toast-area">
        <div class="toast-pauta" ng-repeat="t in toasts" ng-class="'toast-' + t.tipo">
            <i class="bi" ng-class="t.tipo === 'erro' ? 'bi-exclamation-circle-fill' : 'bi-check-circle-fill'"></i>
            <span>{{ t.texto }}</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/angular@1.8.3/angular.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/angular-route@1.8.3/angular-route.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/services.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/controllers.js"></script>
</body>
</html>
